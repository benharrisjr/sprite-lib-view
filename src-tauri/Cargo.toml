[package]
name = "sprite-lib-view"
version = "0.1.0"
description = "Browse, search and inspect folders of sprite sheets"
edition = "2021"

[lib]
name = "sprite_lib_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
imagesize = "0.13"
clipboard-rs = "0.2"
